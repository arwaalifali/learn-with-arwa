<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/favicon.png" />
    <title>Learn with Arwa | Surah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lato:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="surah-page">
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="logo" href="index.html" aria-label="Learn with Arwa home">
          <img class="logo-image" src="assets/logo.png?v=6" alt="Learn with Arwa logo" />
        </a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a class="active" href="quran.html">Quran</a></li>
          <li><a href="hadith.html">Hadith</a></li>
          <li><a href="duas.html">Duas</a></li>
          <li><a href="prayer-times.html">Prayer Times</a></li>
          <li><a href="islamic-calendar.html">Islamic Calendar</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container">
          <a class="back-link" href="quran.html">← Back to all Surahs</a>

          <!-- Reciter Picker (always visible, above content) -->
          <div class="reciter-picker-box fade-in-element">
            <label class="reciter-picker-title" for="reciter-picker-select">Choose Reciter</label>
            <select id="reciter-picker-select" class="reciter-picker-select" aria-label="Choose reciter">
              <option value="husri">Mahmoud Al-Husri</option>
              <option value="abdulbasit">Abdul Basit Abdul Samad</option>
              <option value="sudais">Sudais</option>
              <option value="shureim">Shureim</option>
              <option value="ghamdi">Saad Al-Ghamdi</option>
              <option value="shatri">Abu Bakr Al-Shatri</option>
              <option value="muaiqly">Maher Al-Muaiqly</option>
              <option value="minshawi">Muhammad Al-Minshawi</option>
              <option value="afasy">Mishary Al-Afasy</option>
              <option value="hanirrifai">Hani Ar-Rifai</option>
            </select>
          </div>

          <section id="surah-viewer" class="surah-viewer" aria-live="polite"></section>
        </div>
      </section>
    </main>

    <div class="follow-dock" role="region" aria-label="Follow mode recitation">
      <div class="container follow-dock-inner">
        <div class="follow-dock-info">
          <div class="follow-dock-info-text">
            <span class="follow-dock-surah" id="follow-dock-surah">—</span>
            <span class="follow-dock-ayah-line" id="follow-dock-ayah">Ayah — of —</span>
          </div>
        </div>
        <div class="follow-dock-transport" role="group" aria-label="Playback controls">
          <button type="button" id="follow-btn-prev" class="follow-dock-btn" title="Previous ayah" aria-label="Previous ayah">
            ⏮
          </button>
          <button type="button" id="follow-btn-rewind" class="follow-dock-btn" title="Back 5 ayahs" aria-label="Rewind five ayahs">
            ⏪
          </button>
          <button type="button" id="follow-btn-play-pause" class="follow-dock-btn follow-dock-btn--primary" title="Play or pause" aria-label="Play">
            ⏯
          </button>
          <button type="button" id="follow-btn-forward" class="follow-dock-btn" title="Forward 5 ayahs" aria-label="Forward five ayahs">
            ⏩
          </button>
          <button type="button" id="follow-btn-next" class="follow-dock-btn" title="Next ayah" aria-label="Next ayah">
            ⏭
          </button>
          <button type="button" id="follow-btn-stop" class="follow-dock-btn" title="Stop" aria-label="Stop and reset">
            ⏹
          </button>
        </div>
        <div class="follow-dock-reciter-wrap">
          <label class="follow-dock-reciter-label" for="reciter-select">Reciter</label>
          <select id="reciter-select" class="follow-dock-select" aria-label="Choose reciter">
            <option value="husri" selected>Mahmoud Al-Husri</option>
            <option value="abdulbasit">Abdul Basit Abdul Samad</option>
            <option value="sudais">Sudais</option>
            <option value="shureim">Shureim</option>
            <option value="ghamdi">Saad Al-Ghamdi</option>
            <option value="shatri">Abu Bakr Al-Shatri</option>
            <option value="muaiqly">Maher Al-Muaiqly</option>
            <option value="minshawi">Muhammad Al-Minshawi</option>
            <option value="afasy">Mishary Al-Afasy</option>
            <option value="hanirrifai">Hani Ar-Rifai</option>
          </select>
        </div>
      </div>
      <p id="follow-dock-status" class="follow-dock-status muted">Follow mode is ready.</p>
    </div>

    <footer class="site-footer dark-section fade-in-element">
      <div class="container footer-grid">
        <div>
          <a class="logo" href="index.html" aria-label="Learn with Arwa home">
            <img class="logo-image" src="assets/logo.png?v=6" alt="Learn with Arwa logo" />
          </a>
        </div>
        <div class="footer-links">
          <h3>Quick Links</h3>
          <a href="index.html">Home</a>
          <a href="quran.html">Quran</a>
          <a href="hadith.html">Hadith</a>
          <a href="duas.html">Duas</a>
          <a href="prayer-times.html">Prayer Times</a>
          <a href="islamic-calendar.html">Islamic Calendar</a>
          <a href="about.html">About</a>
        </div>
        <div>
          <p class="footer-quote">رَبِّ زِدْنِي عِلْمًا</p>
        </div>
      </div>
      <div class="footer-bottom">
        <span id="year"></span> Learn with Arwa. All rights reserved.
      </div>
    </footer>

    <script type="module" src="scripts/common.js"></script>
    <script type="module" src="scripts/surah.js"></script>
  </body>
</html>
